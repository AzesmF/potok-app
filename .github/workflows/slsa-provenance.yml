name: INT-L3 SLSA Provenance

on:
  push:
    tags:
      - 'v*'  # Запускается только при создании Git tag (релиза)
  workflow_dispatch:  # Возможность запустить вручную

jobs:
  build-and-provenance:
    name: Build Docker Image & Generate Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Для создания/обновления GitHub Release
      id-token: write  # Для OIDC (если понадобится в будущем)
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Полная история для provenance

      - name: Extract Version from Tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image & Get Digest
        id: build
        run: |
          cd backend
          # Собираем образ локально
          docker build -t potok-app-backend:${{ steps.version.outputs.version }} .
          
          # Получаем SHA256 хеш образа (это и есть главный идентификатор для SLSA)
          IMAGE_ID=$(docker inspect --format='{{index .Id}}' potok-app-backend:${{ steps.version.outputs.version }})
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "🔒 Image ID: $IMAGE_ID"

      - name: Generate SLSA Provenance
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_HASH=$(git archive HEAD | sha256sum | cut -d' ' -f1)
          
          cat << PROVENANCE > slsa-provenance.json
          {
            "buildType": "https://github.com/AzesmF/potok-app/docker-build@v1",
            "builder": {
              "id": "https://github.com/AzesmF/potok-app/.github/workflows/slsa-provenance.yml"
            },
            "invocation": {
              "configSource": {
                "uri": "https://github.com/AzesmF/potok-app",
                "digest": {"sha1": "$GIT_SHA"},
                "entryPoint": ".github/workflows/slsa-provenance.yml"
              },
              "parameters": {"version": "${{ steps.version.outputs.version }}"}
            },
            "buildConfig": {
              "dockerfile": "backend/Dockerfile",
              "context": "backend/"
            },
            "materials": [
              {
                "uri": "https://github.com/AzesmF/potok-app",
                "digest": {"sha1": "$GIT_SHA", "sha256": "$SOURCE_HASH"}
              }
            ],
            "metadata": {
              "buildInvocationID": "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT",
              "buildStartedOn": "$BUILD_TIME",
              "completeness": {"parameters": true, "environment": false, "materials": true},
              "reproducible": false
            }
          }
          PROVENANCE
          
          echo "✅ SLSA Provenance generated"

      - name: Generate Image Checksum
        run: |
          cd backend
          # Сохраняем только хеш образа, а не сам образ (чтобы не превысить 2GB лимит GitHub)
          docker images potok-app-backend:${{ steps.version.outputs.version }} --format "{{.ID}}" > ../image-id.txt
          echo "potok-app-backend:${{ steps.version.outputs.version }} $(docker inspect --format='{{index .Id}}' potok-app-backend:${{ steps.version.outputs.version }})" > ../potok-app-backend-${{ steps.version.outputs.version }}.sha256
          cd ..
          echo "🔒 Image checksum generated:"
          cat potok-app-backend-${{ steps.version.outputs.version }}.sha256

      - name: Update GitHub Release with Provenance
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slsa-provenance.json
            potok-app-backend-${{ steps.version.outputs.version }}.sha256
          tag_name: ${{ github.ref_name }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Provenance as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slsa-provenance-${{ steps.version.outputs.version }}
          path: slsa-provenance.json
          retention-days: 365
