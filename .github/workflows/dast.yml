name: PUR-L3 DAST (OWASP ZAP)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python & Install Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Backend Server
        run: |
          cd backend
          # Запускаем сервер в фоне для сканирования
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 10 # Ждем запуска
          curl -f http://127.0.0.1:8000/health || exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://127.0.0.1:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j' # -a: активный скан, -j: поддержка AJAX/SPA (для Flutter Web в будущем)

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap_report.html
