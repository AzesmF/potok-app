name: TRA-L3 Audit Log Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/audit_log.jsonl'
      - 'tools/export-audit-bundle.py'
  schedule:
    # Еженедельная проверка целостности даже без изменений (каждую пятницу в 00:00)
    - cron: '0 0 * * 5'
  workflow_dispatch: # Возможность запустить вручную

jobs:
  verify-worm-chain:
    name: Verify WORM Chain Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Audit Bundle & Verify Chain
        run: |
          python3 tools/export-audit-bundle.py
          
          # Строгая проверка: если цепочка сломана, workflow упадет
          python3 -c "
          import json
          import sys
          
          with open('audit-bundle.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
              
          worm_status = data['artifacts']['TRA-L3 (Audit & Observability)']['worm_audit']
          
          if worm_status['status'] == 'empty':
              print('⚠️ WORM log is empty, but structurally valid.')
              sys.exit(0)
              
          if not worm_status['chain_valid']:
              print('❌ CRITICAL: WORM chain integrity verification FAILED!')
              print(f'Last known hash: {worm_status.get(\"last_hash\", \"unknown\")}')
              sys.exit(1)
              
          print(f'✅ WORM chain integrity verified. Entries: {worm_status[\"entries\"]}')
          "

      - name: Upload Audit Bundle Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-bundle-report
          path: audit-bundle.json
          retention-days: 365
