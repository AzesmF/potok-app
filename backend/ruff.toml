# Конфигурация Ruff для стандартов KON-MATRIX EVO-L3

line-length = 120
target-version = "py310"

[lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "BLE", "DTZ", "LOG", "RUF",
]

ignore = [
    "B008",   # FastAPI Depends требует вызова функции в аргументах
    "BLE001", # Мы намеренно ловим Exception в API для возврата 500 и логирования
    "RUF001", # Игнорируем проверку омоглифов в строках (проект нативно русскоязычный)
    "RUF002", # Игнорируем проверку омоглифов в докстрингах (проект нативно русскоязычный)
    "RUF003", # Игнорируем проверку омоглифов в комментариях
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
